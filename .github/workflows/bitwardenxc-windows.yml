name: BitwardenXC Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitwardenxc-windows-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Check out release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate release version
        id: version
        run: |
          count=$(git rev-list --first-parent --count "$GITHUB_SHA")
          if [[ ! "$count" =~ ^[1-9][0-9]{0,4}$ ]] || (( count > 65535 )); then
            echo "Commit count $count is outside the MSI version range." >&2
            exit 1
          fi
          printf 'version=2.8.%s\n' "$count" >> "$GITHUB_OUTPUT"

      - name: Tag the source commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          if target=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Release tag $TAG points to $target instead of $GITHUB_SHA." >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi

  build:
    needs: tag
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      BITWARDENXC_VERSION: ${{ needs.tag.outputs.version }}
      QT_ROOT_DIR: ${{ github.workspace }}/.ci-qt
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.ci-vcpkg-cache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read vcpkg baseline
        id: vcpkg
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -cnotmatch '^[0-9a-f]{40}$') {
            throw 'vcpkg.json must specify a full Git commit as its builtin baseline.'
          }
          "baseline=$baseline" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Check out vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg.outputs.baseline }}
          path: .ci-vcpkg
          persist-credentials: false

      - name: Restore compiled vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-2025-x64-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/vcpkg-triplets/*.cmake') }}

      - name: Restore Qt 6.11.2
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.QT_ROOT_DIR }}
          key: qt-6.11.2-msvc2022-x64-202608131017-v1

      - name: Install Qt 6.11.2
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          $repository = 'https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6112/qt6_6112_msvc2022_64/qt.qt6.6112.win64_msvc2022_64'
          $packageVersion = '6.11.2-0-202608131017'
          $suffix = 'Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z'
          $archives = [ordered]@{
            "qtbase-$suffix" = 'fd984b7264361b4dd3fd2a417702ca1258e4086268f2ee6a69b9a393d9c3f6bb'
            "qtsvg-$suffix" = '417f44499c835b2303f3ff78043179bb23442f33d5d2816fbf7e8dbf275b1c89'
            "qtdeclarative-$suffix" = '5591ca564c1a9299a45a15b6b1d324c86e0aaed7cf6c47b7e6fe464aecae2587'
            "qttools-$suffix" = '5f2b387a1f8055102b1388ff4ea743124ed6389d442f75c659728bb5c2a56946'
            "qttranslations-$suffix" = '1c9516ce25d286ecf97e7aaaa5c8fa395823f21af5fa3dcb7bd06f648453dd77'
            'd3dcompiler_47-x64.7z' = 'b1c379f739fa59a495a388c0878757e3d90fb72e0df771237a1ee4a2c1675d15'
            'opengl32sw-64-mesa_11_2_2-signed_sha256.7z' = '59a086716cfd4bdec035698d501ba45526f8d2ecb5c0c428a356d8be0b5d2c79'
          }
          New-Item -ItemType Directory -Force -Path $env:QT_ROOT_DIR | Out-Null
          foreach ($archive in $archives.GetEnumerator()) {
            $filename = "$packageVersion$($archive.Key)"
            $download = Join-Path $env:RUNNER_TEMP $filename
            curl.exe --fail --silent --show-error --location --retry 3 --connect-timeout 30 --max-time 300 `
              --output $download "$repository/$filename"
            if ($LASTEXITCODE -ne 0) { throw "Qt download failed for $filename." }
            $sha256 = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sha256 -cne $archive.Value) { throw "Qt SHA-256 mismatch for $filename." }
            tar.exe -xf $download -C $env:QT_ROOT_DIR
            if ($LASTEXITCODE -ne 0) { throw "Qt extraction failed for $filename." }
            Remove-Item -LiteralPath $download
          }
          Copy-Item -LiteralPath (Join-Path $env:QT_ROOT_DIR 'd3dcompiler_47.dll'), `
            (Join-Path $env:QT_ROOT_DIR 'opengl32sw.dll') -Destination (Join-Path $env:QT_ROOT_DIR 'bin')

      - name: Verify and expose Qt
        run: |
          $qtBin = Join-Path $env:QT_ROOT_DIR 'bin'
          $qtConfig = Join-Path $env:QT_ROOT_DIR 'lib/cmake/Qt6/Qt6Config.cmake'
          if (-not (Test-Path -LiteralPath $qtConfig -PathType Leaf)) { throw 'Qt 6 configuration is missing.' }
          $version = & (Join-Path $qtBin 'windeployqt.exe') --version
          if ($LASTEXITCODE -ne 0 -or $version -ne '6.11.2') { throw 'Qt 6.11.2 tools are unavailable.' }
          $qtBin >> $env:GITHUB_PATH

      - name: Set up Visual Studio x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Bootstrap vcpkg
        run: .\.ci-vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Set up WiX 4.0.6
        run: |
          $wixRoot = Join-Path $env:RUNNER_TEMP 'bitwardenxc-wix'
          dotnet tool install --tool-path $wixRoot wix --version 4.0.6 --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'WiX install failed.' }
          $env:DOTNET_ROLL_FORWARD = 'Major'
          $env:WIX_EXTENSIONS = $wixRoot
          & (Join-Path $wixRoot 'wix.exe') extension add --global WixToolset.UI.wixext/4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension install failed.' }
          "WIX=$wixRoot" >> $env:GITHUB_ENV
          "WIX_EXTENSIONS=$wixRoot" >> $env:GITHUB_ENV
          'DOTNET_ROLL_FORWARD=Major' >> $env:GITHUB_ENV

      - name: Configure and install Release dependencies
        run: |
          $toolchain = Join-Path $PWD '.ci-vcpkg/scripts/buildsystems/vcpkg.cmake'
          $triplets = Join-Path $PWD '.github/vcpkg-triplets'
          $cli = Join-Path $PWD 'build/companion/bw.exe'
          $cliLicense = Join-Path $env:RUNNER_TEMP 'bitwardenxc-cli-build/clients/LICENSE_GPL.txt'
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DKEEPASSXC_BUILD_TYPE=Release `
            "-DOVERRIDE_VERSION=$env:BITWARDENXC_VERSION" `
            -DWITH_TESTS=OFF `
            -DWITH_BUILD_QT=OFF `
            -DKPXC_FEATURE_DOCS=OFF `
            -DKPXC_FEATURE_UPDATES=ON `
            "-DBITWARDENXC_COMPANION_CLI=$cli" `
            "-DBITWARDENXC_COMPANION_LICENSE=$cliLicense" `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DVCPKG_OVERLAY_TRIPLETS=$triplets" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DX_VCPKG_APPLOCAL_DEPS_INSTALL=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }

      - name: Save compiled vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build BitwardenXC
        run: cmake --build build --parallel

      - name: Build Bitwarden CLI companion
        run: |
          ./utils/build-bitwardenxc-cli.ps1 `
            -WorkDirectory (Join-Path $env:RUNNER_TEMP 'bitwardenxc-cli-build') `
            -OutputDirectory (Join-Path $PWD 'build/companion')

      - name: Package and verify ZIP and MSI
        run: |
          $packageName = 'BitwardenXC-Windows-x64'
          foreach ($generator in @('ZIP', 'WIX')) {
            cpack --config build/CPackConfig.cmake -G $generator -B dist -D "CPACK_PACKAGE_FILE_NAME=$packageName"
            if ($LASTEXITCODE -ne 0) { throw "CPack $generator failed." }
          }

          $cliSource = Join-Path $env:RUNNER_TEMP 'bitwardenxc-cli-build/clients'
          git -C $cliSource add -u
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the patched CLI source.' }
          git -C $cliSource add -A -- apps/cli/src
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the new companion CLI files.' }
          $tree = git -C $cliSource write-tree
          if ($LASTEXITCODE -ne 0) { throw 'Could not write the patched CLI source tree.' }
          $cliSourceZip = Join-Path $PWD 'dist/BitwardenXC-CLI-Source.zip'
          git -C $cliSource archive --format=zip --prefix=BitwardenXC-CLI/ --output=$cliSourceZip $tree
          if ($LASTEXITCODE -ne 0) { throw 'Could not archive the patched CLI source.' }

          function Test-Package($directory, [bool]$portable) {
            $executables = @(Get-ChildItem -LiteralPath $directory -Filter 'BitwardenXC.exe' -File -Recurse)
            if ($executables.Count -ne 1) { throw "Expected exactly one BitwardenXC.exe in $directory." }
            $app = $executables[0]
            $required = @('bw.exe', 'LICENSE-BITWARDEN-CLI.txt', 'keepassxc-cli.exe',
                          'Qt6Core.dll', 'Qt6Widgets.dll', 'botan-3.dll',
                          'platforms/qwindows.dll', 'tls/qschannelbackend.dll')
            foreach ($file in $required) {
              if (-not (Test-Path -LiteralPath (Join-Path $app.DirectoryName $file) -PathType Leaf)) {
                throw "Missing package file: $file"
              }
            }
            if ((Test-Path -LiteralPath (Join-Path $app.DirectoryName '.portable')) -ne $portable) {
              throw 'Unexpected portable marker in packaged files.'
            }
            if ($app.VersionInfo.ProductVersion -cne $env:BITWARDENXC_VERSION) {
              throw "Unexpected Windows product version: $($app.VersionInfo.ProductVersion)"
            }

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $app.FullName
            $startInfo.WorkingDirectory = $app.DirectoryName
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $startInfo.ArgumentList.Add('--version')
            $startInfo.Environment['PATH'] = "$env:SystemRoot\System32;$env:SystemRoot"
            $startInfo.Environment['QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES'] = '1'
            foreach ($name in @('QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH', 'QML_IMPORT_PATH', 'QML2_IMPORT_PATH')) {
              $null = $startInfo.Environment.Remove($name)
            }
            $process = [System.Diagnostics.Process]::Start($startInfo)
            try {
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              if (-not $process.WaitForExit(30000)) {
                $process.Kill()
                throw 'Packaged BitwardenXC did not exit after --version.'
              }
              if ($process.ExitCode -ne 0) {
                throw "Packaged BitwardenXC failed to start: $($process.ExitCode) $($stderr.GetAwaiter().GetResult())"
              }
              $version = $stdout.GetAwaiter().GetResult().Trim()
              if ($version -cne "BitwardenXC $env:BITWARDENXC_VERSION") {
                throw "Unexpected packaged executable version: $version"
              }
              Write-Output $version
            } finally {
              $process.Dispose()
            }

            ./utils/Test-WindowsPackage.ps1 -Executable $app.FullName

            $env:BITWARDENCLI_APPDATA_DIR = Join-Path $directory 'cli-profile'
            New-Item -ItemType Directory -Force -Path $env:BITWARDENCLI_APPDATA_DIR | Out-Null
            $cli = Join-Path $app.DirectoryName 'bw.exe'
            $cliVersion = & $cli --version
            if ($LASTEXITCODE -ne 0 -or $cliVersion -cne '2026.10.1-bitwardenxc.4') {
              throw 'The packaged Bitwarden CLI could not be verified.'
            }
            $cacheProbe = '{"serverUrl":"https://example.invalid","email":"cache-smoke@example.invalid","password":"synthetic-only"}'
            $cacheResult = $cacheProbe | & $cli --nointeraction --raw bitwardenxc-open-cache
            if ($LASTEXITCODE -ne 0 -or ($cacheResult | ConvertFrom-Json).kind -cne 'unavailable') {
              throw 'The packaged Bitwarden CLI could not check an empty encrypted cache.'
            }
          }

          $zip = Get-Item "dist/$packageName.zip"
          $msi = Get-Item "dist/$packageName.msi"
          $zipSmoke = Join-Path $env:RUNNER_TEMP 'bitwardenxc-portable-smoke'
          $msiSmoke = Join-Path $env:RUNNER_TEMP 'bitwardenxc-msi-smoke'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $zipSmoke
          $extract = [System.Diagnostics.ProcessStartInfo]::new()
          $extract.FileName = Join-Path $env:SystemRoot 'System32/msiexec.exe'
          $extract.UseShellExecute = $false
          foreach ($arg in @('/a', $msi.FullName, '/qn', "TARGETDIR=$msiSmoke")) {
            $extract.ArgumentList.Add($arg)
          }
          $process = [System.Diagnostics.Process]::Start($extract)
          try {
            if (-not $process.WaitForExit(90000)) {
              $process.Kill()
              throw 'MSI administrative extraction did not finish.'
            }
            if ($process.ExitCode -ne 0) { throw "MSI extraction failed: $($process.ExitCode)" }
          } finally {
            $process.Dispose()
          }
          Test-Package $zipSmoke $true
          Test-Package $msiSmoke $false

          Get-Item $zip.FullName, $msi.FullName, $cliSourceZip | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitwardenxc-windows-x64
          path: |
            dist/BitwardenXC-Windows-x64.zip
            dist/BitwardenXC-Windows-x64.msi
            dist/BitwardenXC-CLI-Source.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bitwardenxc-windows-x64

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.version }}
        run: |
          sha256sum --check SHA256SUMS
          tag_commit=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag $TAG points to $tag_commit instead of $GITHUB_SHA." >&2
            exit 1
          fi
          assets=(BitwardenXC-Windows-x64.msi BitwardenXC-Windows-x64.zip BitwardenXC-CLI-Source.zip SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag --title "BitwardenXC $TAG for Windows x64" \
              --notes "Use the MSI for installation or to update an existing MSI install. For portable use, extract the Windows ZIP and run BitwardenXC.exe. Both packages include the patched Bitwarden CLI, with source in BitwardenXC-CLI-Source.zip. Built from $GITHUB_SHA." \
              --prerelease --latest=false
          fi
          # Older builds can finish later. Only the current main build can replace Latest.
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            main_commit=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [[ "$main_commit" == "$GITHUB_SHA" ]]; then
              gh release edit "$TAG" --prerelease=false --latest
            fi
          fi
