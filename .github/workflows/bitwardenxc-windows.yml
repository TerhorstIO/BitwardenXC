name: BitwardenXC Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitwardenxc-windows-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      QT_ROOT_DIR: ${{ github.workspace }}/.ci-qt
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.ci-vcpkg-cache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read vcpkg baseline
        id: vcpkg
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -cnotmatch '^[0-9a-f]{40}$') {
            throw 'vcpkg.json must specify a full Git commit as its builtin baseline.'
          }
          "baseline=$baseline" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Check out vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg.outputs.baseline }}
          path: .ci-vcpkg
          persist-credentials: false

      - name: Restore compiled vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-2025-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Restore Qt 6.11.2
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.QT_ROOT_DIR }}
          key: qt-6.11.2-msvc2022-x64-202608131017-v1

      - name: Install Qt 6.11.2
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          $repository = 'https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6112/qt6_6112_msvc2022_64/qt.qt6.6112.win64_msvc2022_64'
          $packageVersion = '6.11.2-0-202608131017'
          $suffix = 'Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z'
          $archives = [ordered]@{
            "qtbase-$suffix" = 'fd984b7264361b4dd3fd2a417702ca1258e4086268f2ee6a69b9a393d9c3f6bb'
            "qtsvg-$suffix" = '417f44499c835b2303f3ff78043179bb23442f33d5d2816fbf7e8dbf275b1c89'
            "qtdeclarative-$suffix" = '5591ca564c1a9299a45a15b6b1d324c86e0aaed7cf6c47b7e6fe464aecae2587'
            "qttools-$suffix" = '5f2b387a1f8055102b1388ff4ea743124ed6389d442f75c659728bb5c2a56946'
            "qttranslations-$suffix" = '1c9516ce25d286ecf97e7aaaa5c8fa395823f21af5fa3dcb7bd06f648453dd77'
            'd3dcompiler_47-x64.7z' = 'b1c379f739fa59a495a388c0878757e3d90fb72e0df771237a1ee4a2c1675d15'
            'opengl32sw-64-mesa_11_2_2-signed_sha256.7z' = '59a086716cfd4bdec035698d501ba45526f8d2ecb5c0c428a356d8be0b5d2c79'
          }
          New-Item -ItemType Directory -Force -Path $env:QT_ROOT_DIR | Out-Null
          foreach ($archive in $archives.GetEnumerator()) {
            $filename = "$packageVersion$($archive.Key)"
            $download = Join-Path $env:RUNNER_TEMP $filename
            curl.exe --fail --silent --show-error --location --retry 3 --connect-timeout 30 --max-time 300 `
              --output $download "$repository/$filename"
            if ($LASTEXITCODE -ne 0) { throw "Qt download failed for $filename." }
            $sha256 = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sha256 -cne $archive.Value) { throw "Qt SHA-256 mismatch for $filename." }
            tar.exe -xf $download -C $env:QT_ROOT_DIR
            if ($LASTEXITCODE -ne 0) { throw "Qt extraction failed for $filename." }
            Remove-Item -LiteralPath $download
          }
          Copy-Item -LiteralPath (Join-Path $env:QT_ROOT_DIR 'd3dcompiler_47.dll'), `
            (Join-Path $env:QT_ROOT_DIR 'opengl32sw.dll') -Destination (Join-Path $env:QT_ROOT_DIR 'bin')

      - name: Verify and expose Qt
        run: |
          $qtBin = Join-Path $env:QT_ROOT_DIR 'bin'
          $qtConfig = Join-Path $env:QT_ROOT_DIR 'lib/cmake/Qt6/Qt6Config.cmake'
          if (-not (Test-Path -LiteralPath $qtConfig -PathType Leaf)) { throw 'Qt 6 configuration is missing.' }
          $version = & (Join-Path $qtBin 'windeployqt.exe') --version
          if ($LASTEXITCODE -ne 0 -or $version -ne '6.11.2') { throw 'Qt 6.11.2 tools are unavailable.' }
          $qtBin >> $env:GITHUB_PATH

      - name: Set up Visual Studio x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Bootstrap vcpkg
        run: .\.ci-vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure and build
        run: |
          $toolchain = Join-Path $PWD '.ci-vcpkg/scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DKEEPASSXC_BUILD_TYPE=Release `
            -DWITH_TESTS=OFF `
            -DWITH_BUILD_QT=OFF `
            -DKPXC_FEATURE_DOCS=OFF `
            -DKPXC_FEATURE_UPDATES=OFF `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DX_VCPKG_APPLOCAL_DEPS_INSTALL=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build build --parallel

      - name: Build Bitwarden CLI companion
        run: |
          ./utils/build-bitwardenxc-cli.ps1 `
            -WorkDirectory (Join-Path $env:RUNNER_TEMP 'bitwardenxc-cli-build') `
            -OutputDirectory (Join-Path $PWD 'build/companion')

      - name: Package and verify portable ZIP
        run: |
          $packageName = 'BitwardenXC-Windows-x64'
          cpack --config build/CPackConfig.cmake -G ZIP -B dist -D "CPACK_PACKAGE_FILE_NAME=$packageName"
          if ($LASTEXITCODE -ne 0) { throw 'CPack failed.' }

          $cliSource = Join-Path $env:RUNNER_TEMP 'bitwardenxc-cli-build/clients'
          git -C $cliSource add -u
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the patched CLI source.' }
          $tree = git -C $cliSource write-tree
          if ($LASTEXITCODE -ne 0) { throw 'Could not write the patched CLI source tree.' }
          $cliSourceZip = Join-Path $PWD 'dist/BitwardenXC-CLI-Source.zip'
          git -C $cliSource archive --format=zip --prefix=BitwardenXC-CLI/ --output=$cliSourceZip $tree
          if ($LASTEXITCODE -ne 0) { throw 'Could not archive the patched CLI source.' }

          $zip = Get-Item "dist/$packageName.zip"
          $archive = [System.IO.Compression.ZipFile]::Open($zip.FullName, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $executables = @($archive.Entries | Where-Object Name -CEQ 'BitwardenXC.exe')
            if ($executables.Count -ne 1) { throw 'Expected exactly one BitwardenXC.exe in the ZIP.' }
            $executablePath = $executables[0].FullName
            $prefix = $executablePath.Substring(0, $executablePath.Length - $executables[0].Name.Length)
            if (-not $archive.GetEntry("${prefix}.portable")) {
              $null = $archive.CreateEntry("${prefix}.portable")
            }
            $required = @('keepassxc-cli.exe', 'Qt6Core.dll', 'Qt6Widgets.dll', 'botan-3.dll',
                          'platforms/qwindows.dll', 'tls/qschannelbackend.dll')
            foreach ($file in $required) {
              if (-not $archive.GetEntry("$prefix$file")) { throw "Missing package file: $file" }
            }
            foreach ($notice in Get-ChildItem COPYING, LICENSE.*, README.md -File) {
              $entry = "$prefix$($notice.Name)"
              if (-not $archive.GetEntry($entry)) {
                $null = [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, $notice.FullName, $entry)
              }
            }
            $null = [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
              $archive, (Join-Path $PWD 'build/companion/bw.exe'), "${prefix}bw.exe")
            $null = [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
              $archive, (Join-Path $cliSource 'LICENSE_GPL.txt'), "${prefix}LICENSE-BITWARDEN-CLI.txt")
          } finally {
            $archive.Dispose()
          }

          $smokeDirectory = Join-Path $env:RUNNER_TEMP 'bitwardenxc-portable-smoke'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $smokeDirectory
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = Join-Path $smokeDirectory $executablePath
          $startInfo.WorkingDirectory = Split-Path -Parent $startInfo.FileName
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.ArgumentList.Add('--version')
          $startInfo.Environment['PATH'] = "$env:SystemRoot\System32;$env:SystemRoot"
          $startInfo.Environment['QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES'] = '1'
          foreach ($name in @('QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH', 'QML_IMPORT_PATH', 'QML2_IMPORT_PATH')) {
            $null = $startInfo.Environment.Remove($name)
          }
          $process = [System.Diagnostics.Process]::Start($startInfo)
          try {
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(30000)) {
              $process.Kill()
              throw 'Packaged BitwardenXC did not exit after --version.'
            }
            if ($process.ExitCode -ne 0) {
              throw "Packaged BitwardenXC failed to start: $($process.ExitCode) $($stderr.GetAwaiter().GetResult())"
            }
            $version = $stdout.GetAwaiter().GetResult().Trim()
            if ($version -notmatch '^BitwardenXC \d+\.\d+\.\d+') {
              throw "Unexpected packaged executable version: $version"
            }
            Write-Output $version
          } finally {
            $process.Dispose()
          }

          $env:BITWARDENCLI_APPDATA_DIR = Join-Path $env:RUNNER_TEMP 'bitwardenxc-packaged-cli-smoke'
          New-Item -ItemType Directory -Force -Path $env:BITWARDENCLI_APPDATA_DIR | Out-Null
          $cliVersion = & (Join-Path $startInfo.WorkingDirectory 'bw.exe') --version
          if ($LASTEXITCODE -ne 0 -or $cliVersion -cne '2026.10.1-bitwardenxc.1') {
            throw 'The packaged Bitwarden CLI could not be verified.'
          }

          Get-Item $zip.FullName, $cliSourceZip | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitwardenxc-windows-x64
          path: |
            dist/BitwardenXC-Windows-x64.zip
            dist/BitwardenXC-CLI-Source.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bitwardenxc-windows-x64

      - name: Publish commit release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: build-${{ github.sha }}
        run: |
          sha256sum --check SHA256SUMS
          if tag_commit=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/dev/null); then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Release tag $TAG points to $tag_commit instead of $GITHUB_SHA." >&2
              exit 1
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" BitwardenXC-Windows-x64.zip BitwardenXC-CLI-Source.zip SHA256SUMS --clobber
          else
            gh release create "$TAG" BitwardenXC-Windows-x64.zip BitwardenXC-CLI-Source.zip SHA256SUMS \
              --target "$GITHUB_SHA" --title "BitwardenXC Windows x64 (${GITHUB_SHA:0:7})" \
              --notes "Portable Windows x64 build from commit $GITHUB_SHA. Extract the Windows ZIP and run BitwardenXC.exe. The package includes the patched Bitwarden CLI. Its source is available in BitwardenXC-CLI-Source.zip." \
              --prerelease --latest=false
          fi
